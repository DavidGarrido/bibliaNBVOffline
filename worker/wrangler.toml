name               = "biblia-nbv-ai"
main               = "bible-ai-worker.js"
compatibility_date = "2024-01-01"

# La clave DeepSeek NO va aquí — se sube con:
#   wrangler secret put AI_API_KEY

# Whisper (transcripción de audio): requiere plan con Workers AI.
# Después de agregarlo: wrangler deploy
[ai]
binding = "AI"

# Estudios compartidos por QR: almacén temporal (KV)
[[kv_namespaces]]
binding = "SHARED_STUDIES"
id = "faef1891e762458e943bd381b277a775"
